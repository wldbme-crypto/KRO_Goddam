<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RO 아이템 노점 검색</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #8b8f9a;
    --accent: #f2b807;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.desc { color: var(--muted); font-size: 13px; margin-top: 0; margin-bottom: 20px; }

  .server-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .server-tabs button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .server-tabs button.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  .search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .search-box input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
  }
  .search-box button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #1a1a1a;
    font-weight: 600;
    cursor: pointer;
  }

  .status { color: var(--muted); font-size: 13px; margin-bottom: 12px; min-height: 18px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
  th, td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  .item-cell { display: flex; align-items: center; gap: 8px; }
  .item-cell img { width: 24px; height: 24px; object-fit: contain; }
  .price { color: var(--accent); font-weight: 600; }

  .empty { text-align: center; padding: 40px 0; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>RO 아이템 노점 검색</h1>
  <p class="desc">gnjoy 공식 사이트의 아이템 거래현황을 실시간으로 조회합니다. (개인 학습용)</p>

  <div class="server-tabs" id="serverTabs">
    <button data-svr="0" class="active">전체</button>
    <button data-svr="129">바포메트</button>
    <!-- 다른 서버ID를 알아내면 여기 버튼 추가 -->
  </div>

  <div class="search-box">
    <input id="itemInput" type="text" placeholder="아이템명을 입력하세요 (예: 무질서한 마력의 룬)" />
    <button id="searchBtn">검색</button>
  </div>

  <div class="status" id="status"></div>
  <div id="resultArea"></div>
</div>

<script>
  // 배포 후 이 값을 실제 Vercel 함수 경로로 유지하면 됩니다.
  // 로컬(vercel dev)이든 배포된 도메인이든 상대경로 /api/search 로 동일하게 동작합니다.
  const API_BASE = "/api/search";

  let currentSvr = "0";

  const tabsEl = document.getElementById("serverTabs");
  const inputEl = document.getElementById("itemInput");
  const btnEl = document.getElementById("searchBtn");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("resultArea");

  tabsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    [...tabsEl.children].forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    currentSvr = btn.dataset.svr;
  });

  btnEl.addEventListener("click", doSearch);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") doSearch();
  });

  async function doSearch() {
    const itemFullName = inputEl.value.trim();
    if (!itemFullName) {
      statusEl.textContent = "아이템명을 입력해주세요.";
      return;
    }

    statusEl.textContent = "검색 중...";
    resultEl.innerHTML = "";

    const url = `${API_BASE}?svrID=${encodeURIComponent(currentSvr)}&itemFullName=${encodeURIComponent(itemFullName)}&curpage=1`;

    try {
      const res = await fetch(url);
      const data = await res.json();

      if (data.error) {
        statusEl.textContent = `오류: ${data.error}`;
        return;
      }

      if (!data.items || data.items.length === 0) {
        statusEl.textContent = "검색 결과가 없습니다.";
        resultEl.innerHTML = `<div class="empty">해당 아이템의 노점 매물이 없습니다.</div>`;
        return;
      }

      statusEl.textContent = `${data.items.length}건 검색됨 ${data.total ? "· " + data.total : ""}`;
      renderTable(data.items);
    } catch (err) {
      statusEl.textContent = "요청 중 오류가 발생했습니다.";
      console.error(err);
    }
  }

  function renderTable(items) {
    const rows = items.map((it) => `
      <tr>
        <td>${escapeHtml(it.server)}</td>
        <td>
          <div class="item-cell">
            ${it.itemImage ? `<img src="${it.itemImage}" alt="" />` : ""}
            <span>${escapeHtml(it.itemName)}</span>
          </div>
        </td>
        <td>${escapeHtml(it.quantity)}</td>
        <td class="price">${escapeHtml(it.price)}</td>
        <td>${escapeHtml(it.shopName || "")}</td>
      </tr>
    `).join("");

    resultEl.innerHTML = `
      <table>
        <thead>
          <tr><th>서버</th><th>아이템</th><th>수량</th><th>가격</th><th>노점</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
</script>
</body>
</html>
